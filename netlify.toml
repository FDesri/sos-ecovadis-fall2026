# SOS-EcoVadis — configuration Netlify
# Éditeur : IMAGINATION@WORK SRL (marque ESGIM). Domaine cible : sos-ecovadis.com

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

[build.processing]
  skip_processing = true

[context.production.environment]
  URL_CANONIQUE = "https://sos-ecovadis.com"

# ---------------------------------------------------------------------------
# Redirections
# ---------------------------------------------------------------------------

# Racine → français. La détection de langue par le navigateur viendra plus tard.
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 301
  force = true

# www → apex (l'apex est canonique). Netlify le fait aussi côté domaine ;
# la règle reste ici pour que le dépôt porte la décision.
[[redirects]]
  from = "https://www.sos-ecovadis.com/*"
  to = "https://sos-ecovadis.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# En-têtes
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = """
      default-src 'self'; \
      base-uri 'self'; \
      form-action 'self' https://*.hsforms.com https://calendly.com; \
      frame-ancestors 'self'; \
      object-src 'none'; \
      script-src 'self' 'unsafe-inline' https://js.hs-scripts.com https://js.hs-analytics.net https://js.hs-banner.com https://js.hscollectedforms.net https://js.hsadspixel.net https://js.hsleadflows.net https://js.usemessages.com https://js.hsforms.net https://cdn2.hubspot.net https://assets.calendly.com; \
      style-src 'self' 'unsafe-inline' https://cdn2.hubspot.net https://assets.calendly.com https://fonts.googleapis.com; \
      font-src 'self' data: https://fonts.gstatic.com https://cdn2.hubspot.net; \
      img-src 'self' data: https: ; \
      connect-src 'self' https://api.hubapi.com https://forms.hubspot.com https://api.hubspot.com https://track.hubspot.com https://forms.hsforms.com https://calendly.com; \
      frame-src https://calendly.com https://*.hubspot.com; \
      upgrade-insecure-requests"""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
