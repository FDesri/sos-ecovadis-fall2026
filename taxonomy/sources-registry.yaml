    publisher: "Union européenne — EUR-Lex"
    kind: regulator
    url: "https://eur-lex.europa.eu/eli/dir/2022/2464/oj"
    accessed: 2026-09-01
    covers: "Reporting de durabilité des entreprises, normes ESRS, champ d'application et calendrier par vague."

  eu-csddd:
