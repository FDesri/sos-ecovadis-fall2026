# ============================================================
# SOS-EcoVadis — Registre des sources citables
# Version: 1.0 (2026-09-01) — décision D14 (vision v1.2)
# Propriétaire: François Dequenne (ESGIM)
#
# Répond à KC-C11 (« les liens ou références se trouvent immédiatement
# après l'affirmation concernée ») et à KC-T11 (aucun lien cassé).
#
# POLITIQUE (révise la décision de gouvernance n° 5 du 27/08/2026) :
#   AUTORISÉ  — référentiels, régulateurs, normalisateurs, institutions
#               publiques et l'éditeur du référentiel lui-même (EcoVadis).
#               Citer sa source ne renvoie pas le lecteur ailleurs :
#               cela prouve qu'on sait de quoi on parle.
#   INTERDIT  — cabinets de conseil concurrents, plateformes de notation
#               concurrentes, agrégateurs commerciaux, comparateurs, et
#               toute page dont le but est de vendre un service que
#               ESGIM vend aussi.
#
# Une fiche ne recopie pas une source : elle la référence par son `id`
# dans `sources: [...]`. build_index.py résout l'id et refuse le build
# si un id n'existe pas ici (KC-G15).
#
# `accessed` : date de dernière vérification manuelle de l'URL.
# Toute URL de ce fichier est re-testée à chaque ré-audit trimestriel
# (GOVERNANCE §3).
# ============================================================

policy:
  allowed_kinds: [rating-scheme, regulator, standard-setter, public-institution, proprietary]
  forbidden: "Concurrents d'ESGIM : cabinets de conseil RSE, plateformes de notation concurrentes, agrégateurs et comparateurs commerciaux."
  rule: "Toute affirmation chiffrée, datée ou réglementaire porte une référence. Une affirmation issue du portefeuille ESGIM référence `esgim-portfolio`, jamais une source externe."

sources:

  ecovadis-methodology:
    title: "EcoVadis Ratings Methodology — Overview and Principles"
    publisher: "EcoVadis"
    kind: rating-scheme
    url: "https://resources.ecovadis.com/whitepapers/ecovadis-ratings-methodology-overview-and-principles-2022-neutral"
    accessed: 2026-09-01
    covers: "Modèle P-A-R, pondération des 21 critères, adaptation sectorielle, taille et géographie."

  ecovadis-medals:
    title: "EcoVadis — médailles, badges et percentiles"
    publisher: "EcoVadis"
    kind: rating-scheme
    url: "https://ecovadis.com/"
    accessed: 2026-09-01
    covers: "Bronze top 35 %, Argent top 15 %, Or top 5 %, Platine top 1 % ; badges Committed et Fast Mover ; bascule vers un classement strictement percentile au 1er janvier 2024."
    note: "Les niveaux en points (Bronze ≈ 64, Argent ≈ 73, Or ≈ 81, Platine ≈ 84 en mai 2026) sont indicatifs et observés sur le portefeuille ESGIM — voir esgim-portfolio. EcoVadis ne publie pas de seuil de points."

  ecovadis-barometer-2026:
    title: "Sustainable Procurement Barometer 2026"
    publisher: "EcoVadis"
    kind: rating-scheme
    url: "https://ecovadis.com/insights/barometer/"
    accessed: 2026-09-01
    covers: "Visibilité des acheteurs sur les pratiques ESG de leurs fournisseurs de rang 1 ; transmission des données carbone dans la chaîne d'approvisionnement."

  ecovadis-360-watch:
    title: "EcoVadis 360° Watch"
    publisher: "EcoVadis"
    kind: rating-scheme
    url: "https://ecovadis.com/"
    accessed: 2026-09-01
